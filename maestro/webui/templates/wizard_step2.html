<div class="wizard-step" data-step="2">
  <div class="wizard-progress" aria-label="Step 2 of 4">
    <span class="wp-dot done"></span>
    <span class="wp-line done"></span>
    <span class="wp-dot active"></span>
    <span class="wp-line"></span>
    <span class="wp-dot"></span>
    <span class="wp-line"></span>
    <span class="wp-dot"></span>
  </div>
  <h2 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">配置团队成员</h2>
  <form>
    {% if top_error %}<div class="field-error" style="margin-bottom: 12px; padding: 8px 12px; background: #fee2e2; border-radius: var(--radius-sm);">{{ top_error }}</div>{% endif %}
    {% for role in role_order %}
    <fieldset style="border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 12px;">
      <legend style="padding: 0 6px; font-size: 12px; font-weight: 600; color: var(--muted);">{{ role_titles[role] }}</legend>
      <label class="field">
        <span class="field-label">成员名</span>
        <input class="field-input" name="member_{{ role }}" value="{{ values[role]['member'] }}"
               hx-post="/wizard/validate-field" hx-trigger="blur"
               hx-vals='{"role": "{{ role }}", "field": "member"}'
               hx-target="#error-{{ role }}-member">
        <span id="error-{{ role }}-member">{% if field_errors.get((role,'member')) %}<span class="field-error">{{ field_errors.get((role,'member'), '') }}</span>{% endif %}</span>
      </label>
      <label class="field">
        <span class="field-label">模型</span>
        <input class="field-input" name="model_{{ role }}" value="{{ values[role]['model'] }}"
               hx-post="/wizard/validate-field" hx-trigger="blur"
               hx-vals='{"role": "{{ role }}", "field": "model"}'
               hx-target="#error-{{ role }}-model">
        <span id="error-{{ role }}-model">{% if field_errors.get((role,'model')) %}<span class="field-error">{{ field_errors.get((role,'model'), '') }}</span>{% endif %}</span>
      </label>
    </fieldset>
    {% endfor %}
    <div style="display: flex; gap: 8px; margin-top: 16px;">
      <button class="btn" hx-post="/wizard/step2-back" hx-target="#wizard-container">← 上一步</button>
      <a href="/" class="btn btn-ghost">取消</a>
      <div style="flex: 1;"></div>
      <button class="btn btn-primary" hx-post="/wizard/step3" hx-include="closest form" hx-target="#wizard-container">下一步 →</button>
    </div>
  </form>
</div>
