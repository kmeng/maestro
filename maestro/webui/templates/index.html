<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maestro · 本地 AI 软件团队</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #111111;
            --muted: #666666;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --fg: #eeeeee;
                --muted: #999999;
            }
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;
            position: relative;
        }
        .hero {
            text-align: center;
            user-select: none;
        }
        .eyebrow {
            font-size: 0.9em;
            color: var(--muted);
            margin-bottom: 0.5em;
            letter-spacing: 0.05em;
        }
        h1 {
            font-family: Georgia, "Noto Serif CJK SC", serif;
            font-size: 3.5em;
            font-weight: 400;
            letter-spacing: 0.15em;
            margin-bottom: 0.3em;
        }
        .hero-copy {
            font-size: 2em;
            font-weight: 300;
            margin-bottom: 0.6em;
        }
        .sub-copy {
            font-size: 0.95em;
            color: var(--muted);
            line-height: 1.6;
        }
        footer {
            position: absolute;
            bottom: 1em;
            right: 1.5em;
            font-size: 0.8em;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="eyebrow">本地 AI 软件团队</div>
        <h1>Maestro</h1>
        <div class="hero-copy">等待第一支乐章</div>
        <div class="sub-copy">
            团队组建 · 项目脚手架 · 执行观测<br>
            将随 Epic 1–3 依次上演
        </div>
    </div>
    <footer>v{{ version }}</footer>
    <script src="/static/vendor/htmx.min.js" defer></script>
</body>
</html>
