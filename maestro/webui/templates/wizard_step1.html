<h2>欢迎使用 Maestro 团队组建向导</h2>
<p>Maestro 是您的本地 AI 软件团队，由四位专业角色组成：编码员、图书管理员、审阅员和记录员。</p>
<p>本向导将引导您为每个角色设定一个成员别名和默认模型。完成后，配置会保存到项目的 <code>.maestro/team.yaml</code> 中。您可以随时通过团队页面（<code>/team</code>）修改单行配置。</p>
<p>架构师（Architect）即您当前使用的 Claude Code 主会话，<strong>不在此处配置</strong>。</p>
