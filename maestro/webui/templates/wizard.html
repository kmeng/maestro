{% extends "_base.html" %}
{% set nav_active = "team" %}
{% block title %}Team setup wizard{% endblock %}

{% block extra_head %}
<!-- Page-specific wizard progress styling – not in shared CSS per design doc § 5.3 -->
<style>
.wizard-progress {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 24px; padding: 8px 0;
}
.wp-dot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--border-strong); border: 2px solid var(--border-strong);
  flex-shrink: 0;
}
.wp-dot.active { background: var(--accent); border-color: var(--accent); }
.wp-dot.done { background: var(--accent); border-color: var(--accent); opacity: 0.6; }
.wp-line {
  flex: 1; height: 2px; background: var(--border-strong);
}
.wp-line.done { background: var(--accent); opacity: 0.6; }
.wizard-step .field { margin-bottom: 12px; }
</style>
{% endblock %}

{% block content %}
  <h1 class="page-h1">Team setup wizard</h1>
  <div class="page-sub">配置四个角色的成员别名与默认模型，保存到 <span class="mono">.maestro/team.yaml</span>。</div>
  <section class="panel" style="max-width: 720px;">
    <div id="wizard-container">{{ step_html | safe }}</div>
  </section>
{% endblock %}
