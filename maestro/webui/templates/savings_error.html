{% extends "_base.html" %}
{% set nav_active = "savings" %}
{% block title %}成本节省 — 错误{% endblock %}
{% block content %}
  <h1 class="page-h1">成本节省</h1>
  <section class="panel" style="border-color: var(--red);">
    <header class="panel-h">
      <h2 class="panel-title" style="color: var(--red);">无法读取 dispatch 日志</h2>
    </header>
    <p style="font-size: 13.5px;">解析路径：<span class="mono">{{ log_path }}</span></p>
    <pre class="mono" style="white-space: pre-wrap; background: #fafafa; padding: 12px; border-radius: var(--radius-sm); font-size: 12px; margin: 12px 0;">{{ error }}</pre>
    <p class="muted" style="font-size: 12.5px;">常见原因：路径指向目录而非文件、文件权限错误、磁盘 I/O 故障。</p>
  </section>
{% endblock %}
