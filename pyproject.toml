[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.0.4"
description = "Maestro — orchestrates a heterogeneous AI software team via MCP."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "jinja2",
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[project.scripts]
maestro = "maestro.cli.main:main"
maestro-webui = "maestro.webui.launcher:main"

[tool.setuptools.packages.find]
include = ["maestro*"]
exclude = ["tests*", "scripts*", "bootstrap*", "docs*"]

[tool.setuptools.package-data]
"maestro.webui" = ["templates/*.html", "static/vendor/*"]
"maestro.scaffold.templates" = ["*.md", "gitignore", "maestro_gitignore"]
