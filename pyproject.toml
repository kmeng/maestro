[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
description = "Maestro — orchestrates a heterogeneous AI software team via MCP."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn",
    "sse-starlette",
    "jinja2",
    "pyyaml",
    "pydantic>=2",
    "python-multipart",  # required to import maestro.webui (FastAPI form route registration)
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio>=0.21",
    "ruff==0.15.14",
    "httpx",  # required by fastapi.testclient.TestClient in the webui tests
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.ruff.lint]
# ruff's default ruleset (pycodestyle E4/E7/E9 + pyflakes F), made explicit so
# future expansion is a visible diff. NB: this is intentionally NOT the full "E"
# category — "E" would add E501 (line-length) etc., a larger scope than v1.0 took on.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
maestro = "maestro.cli.main:main"
maestro-webui = "maestro.webui.launcher:main"

[tool.setuptools.packages.find]
include = ["maestro*"]
exclude = ["tests*", "scripts*", "bootstrap*", "docs*"]

[tool.setuptools.package-data]
"maestro.webui" = ["templates/*.html", "static/vendor/*"]
"maestro.scaffold.templates" = ["*.md", "gitignore", "maestro_gitignore"]
