name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'   # dev branches: v1.0, v1.1, v2.0, ... (digit after v; avoids the contested `+` glob)
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ruff + pytest
    runs-on: ubuntu-latest
    env:
      # The MCP server reads DEEPSEEK_API_KEY at import; tests mock the client and
      # make no real calls, so a dummy value is enough (same pattern as the smoke script).
      DEEPSEEK_API_KEY: dummy-key-for-ci-no-real-calls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # MCP-server deps (mcp, openai) live here, separate from pyproject — mirror release.yml
          pip install -r bootstrap/requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
